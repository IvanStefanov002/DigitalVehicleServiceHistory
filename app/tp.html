    <script>
        let texts = {
            Cancel: "Отказ",
            Ok: "Да",
            EnterSecurityCode: "Моля, въведете кода за сигурност, отпечатан върху Вашата разписка",
            InvalidSecurityCode: "Невалиден код за сигурност",
            PendingTroubleTicketModalTitle: "За този тол продукт вече има сигнал за проблем в процес на обработка.",
            PendingTroubleTicketModelSubtitle: "Трябва да се затвори преди да се отвори нов.",
            NSPReceipt: "За подробности относно маршрутните карти, моля, свържете се с Вашия доставчик на тол услуги."
        };


        function createTroubleTicket(url, pendingTroubleTicketId)
        {
            if (pendingTroubleTicketId > 0) {
                Swal.fire({
                    type: 'info',
                    title: texts.PendingTroubleTicketModalTitle,
                    text: texts.PendingTroubleTicketModelSubtitle,
                    confirmButtonText: texts.Ok
                })
                return;
            }
            window.location = url;
        }

        function sendEvignetteMail(ticketNumber) {
            sendMail("/Evignette/SendEvignetteMail" + "?id=" + ticketNumber
                , "Въведете Вашия имейл адрес"
                , "Изпращане"
                , "Да"
                , texts.Cancel
                , texts.Ok
                , "Имейлът беше изпратен"
                , "Моля, въведете валиден имейл адрес");
        }

        function sendRoutePassMail(url) {
            sendMail(url
                , "Въведете Вашия имейл адрес"
                , "Изпращане"
                , texts.Ok
                , texts.Cancel
                , "Възникна проблем при изпращането на имейла. Моля, опитайте отново по-късно"
                , "Имейлът беше изпратен"
                , "Моля, въведете валиден имейл адрес");
        }

        function downloadRoutePassReceipt(isNSP, frmName) {

            if (isNSP) {
                Swal.fire({
                    type: 'info',
                    text: texts.NSPReceipt,
                    confirmButtonText: texts.Ok
                });
            }
            document.getElementById(frmName).submit();
        }

        function downloadRoutePassDetailedReceipt(frmName, routePassNumber)
        {
            Swal.fire({
                title: texts.EnterSecurityCode,
                input: 'password',
                showCancelButton: true,
                reverseButtons: true,
                confirmButtonText: texts.Ok,
                cancelButtonText: texts.Cancel,
                inputValidator: (securityCode) => {
                    return new Promise((resolve) => {
                        $.post('/RoutePass/IsValidRoutePassSecurityCode', {
                            routePassNumber: routePassNumber,
                            securityCode: securityCode
                        })
                            .done(function (isValidRoutePassSecurityCode) {
                                if (isValidRoutePassSecurityCode) {
                                    resolve();
                                }
                                else {
                                    resolve(texts.InvalidSecurityCode);
                                }
                            })
                    })
                },
                allowOutsideClick: function () { !Swal.isLoading() }
            }).then((result) => {
                if (result.value) {
                    document.getElementById('fldCode' + routePassNumber).value = result.value;
                    document.getElementById(frmName).submit();
                }
            });
        }

        function viewTrobleTicket(url, troubleTicketQuantity)
        {
            if (troubleTicketQuantity == 0)
                return;
            window.location = url;
        }

        $(document).ready(function () {
            var table = $('#grTollProducts').DataTable({
                info: false,
                lengthChange: false,
                ordering: false,
                searching: false,
                paging: false,
                initComplete: function (settings, json) {
                    $('#grTollProducts').show();
                },
                language: {
                    url: '/Content/lib/datatables/locales/bg.json'
                },
            });

            $('#btnClearFilters').click(function () {
                $("#ddlVehicleNationality").val([]);
                $('#ddlVehicleNationality').selectpicker('refresh');
                $("#txtLicensePlateNumber").val("");
                $("#divResults").empty();

                // get the form inside we are working - change selector to your form as needed
                var $form = $(this).closest("form");
                // get validator object
                var $validator = $form.validate();
                // get errors that were created using jQuery.validate.unobtrusive
                var $errors = $form.find(".field-validation-error span");
                // trick unobtrusive to think the elements were succesfully validated
                // this removes the validation messages
                $errors.each(function() { $validator.settings.success($(this)); });
                // clear errors from validation
                $validator.resetForm();
            });

            $('#ddlVehicleNationality').on('change', function () {
                if ($("#txtLicensePlateNumber").val() !== "") {
                    $('#txtLicensePlateNumber').val($('#txtLicensePlateNumber').val().toUpperCase());
                }
            });
        });
    </script>
